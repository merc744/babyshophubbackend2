spring.application.name=babyshophub

server.port=8081
# Database Connection URL (change 'mydb' to your database name)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/babyshophub_db}

# Database Credentials
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JDBC Driver (Spring Boot usually detects this automatically)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL Auto (creates/updates tables automatically based on Java entities)
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL queries in the console (great for debugging)
spring.jpa.show-sql=true

## Remove this line entirely:
# springdoc.swagger-ui.path=/swagger-ui.html

# Keep or update api-docs to match standard springdoc path:
springdoc.api-docs.path=/v3/api-docs

# Sort paths alphabetically in the UI
springdoc.swagger-ui.operationsSorter=alpha

# Enable "Try it out" button by default for all endpoints
springdoc.swagger-ui.tryItOutEnabled=true


# SMTP Server Details for Gmail (Port 465 SSL with explicit Java 21 properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Comma-separated frontend origins allowed to call this API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# Session cookie hardening. Secure must stay false for plain HTTP local development;
# set SESSION_COOKIE_SECURE=true in production (HTTPS).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
